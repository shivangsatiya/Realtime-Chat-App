server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router) — fall back to index.html for any
    # path that isn't a real static file, same purpose as the Render
    # "Rewrite /* -> /index.html" rule used in the actual deployment.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
